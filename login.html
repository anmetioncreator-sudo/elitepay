<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no"/>
    <title>Login - ZiniPay Payment Automation</title>
    <link rel="shortcut icon" href="assets/images/elitepay-favicon.svg" type="image/svg+xml"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        sky: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            400: '#38bdf8',
                            500: '#0ea5e9',
                            600: '#0284c7',
                            700: '#0369a1',
                        }
                    },
                    fontFamily: {
                        sans: ['Poppins', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        .btn-zini-gradient {
            background: linear-gradient(90deg, #007aff 0%, #5bc0ff 50%, #007aff 100%);
            background-size: 200% auto;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 8px 25px rgba(0, 122, 255, 0.3);
        }
        .btn-zini-gradient:hover {
            background-position: right center;
            box-shadow: 0 12px 30px rgba(0, 122, 255, 0.45);
            transform: translateY(-1px);
        }
    </style>
</head>
<body class="bg-gradient-to-b from-white via-sky-50/40 to-[#f5f9ff] min-h-screen flex items-center justify-center p-4 text-slate-800 font-sans">
    <div class="w-full max-w-md my-6">
        
        <!-- Logo -->
        <div class="text-center mb-6">
            <a href="./" class="inline-flex items-center gap-3">
                <span class="flex h-11 w-11 items-center justify-center rounded-full border border-sky-100 bg-sky-50 shadow-sm">
                    <svg class="h-6 w-6 text-sky-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                        <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"></path>
                    </svg>
                </span>
                <span class="text-2xl font-extrabold tracking-tight text-sky-600">ZiniPay</span>
            </a>
            <p class="text-xs text-slate-500 mt-1">Smart Payment Automation Portal</p>
        </div>

        <!-- 1-Click Fast Role Switcher Box -->
        <div class="bg-slate-900 border border-slate-800 rounded-3xl p-5 mb-5 text-white shadow-xl">
            <div class="text-xs font-bold text-slate-300 mb-2 flex items-center justify-between">
                <span>⚡ 1-Click Test Login Accounts:</span>
                <span class="text-[10px] text-emerald-400 font-mono">Isolated Panels</span>
            </div>
            <div class="space-y-2 text-xs">
                <!-- 1. Admin Owner -->
                <button type="button" onclick="quickLogin('admin')" class="w-full flex items-center justify-between p-2.5 rounded-xl bg-amber-500/15 hover:bg-amber-500/25 border border-amber-500/30 text-amber-300 font-bold transition cursor-pointer text-left">
                    <div class="flex items-center gap-2">
                        <span class="text-base">👑</span>
                        <div>
                            <div>Platform Owner (Admin)</div>
                            <div class="text-[10px] text-amber-400/70 font-mono">admin@zinipay.com</div>
                        </div>
                    </div>
                    <span class="text-[11px] bg-amber-500 text-slate-950 px-2 py-0.5 rounded font-extrabold">&rarr; Admin Panel</span>
                </button>

                <!-- 2. Customer 1 (Tanvir Shop) -->
                <button type="button" onclick="quickLogin('tanvir')" class="w-full flex items-center justify-between p-2.5 rounded-xl bg-sky-500/15 hover:bg-sky-500/25 border border-sky-500/30 text-sky-300 font-bold transition cursor-pointer text-left">
                    <div class="flex items-center gap-2">
                        <span class="text-base">👤</span>
                        <div>
                            <div>Customer 1 (Tanvir Shop)</div>
                            <div class="text-[10px] text-sky-400/70 font-mono">tanvir@shop.com</div>
                        </div>
                    </div>
                    <span class="text-[11px] bg-sky-500 text-white px-2 py-0.5 rounded font-extrabold">&rarr; Shop Panel</span>
                </button>

                <!-- 3. Customer 2 (Ayesha Boutique) -->
                <button type="button" onclick="quickLogin('ayesha')" class="w-full flex items-center justify-between p-2.5 rounded-xl bg-purple-500/15 hover:bg-purple-500/25 border border-purple-500/30 text-purple-300 font-bold transition cursor-pointer text-left">
                    <div class="flex items-center gap-2">
                        <span class="text-base">👗</span>
                        <div>
                            <div>Customer 2 (Ayesha Boutique)</div>
                            <div class="text-[10px] text-purple-400/70 font-mono">ayesha@boutique.com</div>
                        </div>
                    </div>
                    <span class="text-[11px] bg-purple-500 text-white px-2 py-0.5 rounded font-extrabold">&rarr; Boutique Panel</span>
                </button>
            </div>
        </div>

        <!-- Standard Login Card -->
        <div class="bg-white rounded-3xl border border-slate-200/80 p-8 shadow-xl shadow-sky-950/5">
            <h2 class="text-2xl font-bold text-slate-900 text-center mb-2">Sign In to Your Account</h2>
            <p class="text-xs text-slate-500 text-center mb-6">Enter your email and password to open your panel</p>

            <form action="#" method="POST" id="loginForm" class="space-y-4 text-xs">
                <div>
                    <label class="font-bold text-slate-700 block mb-1.5">Email Address</label>
                    <input type="text" id="inputUsername" name="username" value="admin@zinipay.com" required class="w-full rounded-xl border border-slate-300 px-4 py-3 text-slate-800 font-medium focus:outline-none focus:border-sky-500 focus:ring-2 focus:ring-sky-100 transition"/>
                </div>

                <div>
                    <div class="flex justify-between items-center mb-1.5">
                        <label class="font-bold text-slate-700">Password</label>
                        <a href="#" class="text-sky-600 hover:underline">Forgot password?</a>
                    </div>
                    <input type="password" id="inputPassword" name="password" value="12345678" required class="w-full rounded-xl border border-slate-300 px-4 py-3 text-slate-800 font-medium focus:outline-none focus:border-sky-500 focus:ring-2 focus:ring-sky-100 transition"/>
                </div>

                <div class="flex items-center gap-2 pt-1">
                    <input type="checkbox" id="rememberMe" checked class="rounded border-slate-300 text-sky-600 focus:ring-sky-500 h-4 w-4"/>
                    <label for="rememberMe" class="text-slate-600 font-medium">Remember me on this device</label>
                </div>

                <div class="pt-3">
                    <button type="submit" class="w-full btn-zini-gradient rounded-xl py-3.5 text-sm font-bold text-white shadow-md cursor-pointer">
                        Sign In &rarr;
                    </button>
                </div>
            </form>
        </div>

        <div class="text-center text-xs text-slate-500 mt-6 space-y-2">
            <p>Don't have an account yet? <a href="register.html" class="text-sky-600 font-bold hover:underline">Create Merchant Account</a></p>
            <p><a href="./" class="text-slate-400 hover:text-slate-600 transition">&larr; Back to ZiniPay Home</a></p>
        </div>
    </div>

    <script>
        // 1-Click Quick Login
        function quickLogin(type) {
            if (type === 'admin') {
                sessionStorage.setItem('zinipay_user_role', 'admin');
                window.location.href = 'admin-panel.html';
            } else if (type === 'tanvir') {
                sessionStorage.setItem('zinipay_user_role', 'customer');
                sessionStorage.setItem('zinipay_customer_key', 'tanvir');
                window.location.href = 'customer-panel.html';
            } else if (type === 'ayesha') {
                sessionStorage.setItem('zinipay_user_role', 'customer');
                sessionStorage.setItem('zinipay_customer_key', 'ayesha');
                window.location.href = 'customer-panel.html';
            }
        }

        // Form Submit Handler
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('inputUsername').value.trim().toLowerCase();

            if (email.includes('admin') || email.includes('owner')) {
                quickLogin('admin');
            } else if (email.includes('ayesha')) {
                quickLogin('ayesha');
            } else {
                quickLogin('tanvir');
            }
        });
    </script>
</body>
</html>
