<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no"/>
    <title>Create Merchant Account - ElitePay Payment Automation</title>
    <link rel="shortcut icon" href="assets/images/elitepay-favicon.svg" type="image/svg+xml"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        sky: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            400: '#38bdf8',
                            500: '#0ea5e9',
                            600: '#0284c7',
                            700: '#0369a1',
                        }
                    },
                    fontFamily: {
                        sans: ['Poppins', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        .btn-elite-gradient, .btn-zini-gradient {
            background: linear-gradient(90deg, #007aff 0%, #5bc0ff 50%, #007aff 100%);
            background-size: 200% auto;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 8px 25px rgba(0, 122, 255, 0.3);
        }
        .btn-elite-gradient:hover, .btn-zini-gradient:hover {
            background-position: right center;
            box-shadow: 0 12px 30px rgba(0, 122, 255, 0.45);
            transform: translateY(-1px);
        }
    </style>
</head>
<body class="bg-gradient-to-b from-white via-sky-50/40 to-[#f5f9ff] min-h-screen flex items-center justify-center p-4 text-slate-800 font-sans">
    <div class="w-full max-w-lg my-8">
        
        <!-- Logo -->
        <div class="text-center mb-6">
            <a href="./" class="inline-flex items-center gap-3">
                <span class="flex h-11 w-11 items-center justify-center rounded-full border border-sky-100 bg-sky-50 shadow-sm">
                    <svg class="h-6 w-6 text-sky-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                        <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"></path>
                    </svg>
                </span>
                <span class="text-2xl font-extrabold tracking-tight text-sky-600">ElitePay</span>
            </a>
            <p class="text-xs text-slate-500 mt-1">Start Accepting Online Payments Automatically</p>
        </div>

        <!-- Register Card -->
        <div class="bg-white rounded-3xl border border-slate-200/80 p-8 shadow-xl shadow-sky-950/5">
            <div class="flex items-center justify-between mb-2">
                <h2 class="text-2xl font-bold text-slate-900">Create Merchant Account</h2>
                <span class="bg-emerald-50 text-emerald-700 text-[10px] font-bold px-2.5 py-1 rounded-full border border-emerald-200">
                    🎁 3-Day Free Trial
                </span>
            </div>
            <p class="text-xs text-slate-500 mb-6">Set your password to register your merchant store with 0% transaction fees.</p>

            <div id="regErrorAlert" class="hidden mb-4 p-3.5 bg-red-50 border border-red-200 text-red-700 text-xs rounded-xl flex items-center gap-2">
                <span class="text-base">⚠️</span>
                <span id="regErrorMsg"></span>
            </div>

            <form action="#" method="POST" id="regForm" class="space-y-4 text-xs">
                <div>
                    <label class="font-bold text-slate-700 block mb-1.5">Full Name</label>
                    <input type="text" id="regFullName" placeholder="e.g. Tanvir Ahmed" required class="w-full rounded-xl border border-slate-300 px-4 py-3 text-slate-800 font-medium focus:outline-none focus:border-sky-500 focus:ring-2 focus:ring-sky-100 transition"/>
                </div>

                <div>
                    <label class="font-bold text-slate-700 block mb-1.5">Business or Store Name</label>
                    <input type="text" id="regStoreName" placeholder="e.g. Tanvir Tech & Gadgets" required class="w-full rounded-xl border border-slate-300 px-4 py-3 text-slate-800 font-medium focus:outline-none focus:border-sky-500 focus:ring-2 focus:ring-sky-100 transition"/>
                </div>

                <div>
                    <label class="font-bold text-slate-700 block mb-1.5">Gmail / Email Address</label>
                    <input type="email" id="regEmail" placeholder="e.g. tanvir@gmail.com" required class="w-full rounded-xl border border-slate-300 px-4 py-3 text-slate-800 font-medium focus:outline-none focus:border-sky-500 focus:ring-2 focus:ring-sky-100 transition"/>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="font-bold text-slate-700 block mb-1.5">Password</label>
                        <input type="password" id="regPassword" placeholder="Min. 6 characters" minlength="6" required class="w-full rounded-xl border border-slate-300 px-4 py-3 text-slate-800 font-medium focus:outline-none focus:border-sky-500 focus:ring-2 focus:ring-sky-100 transition"/>
                    </div>
                    <div>
                        <label class="font-bold text-slate-700 block mb-1.5">Confirm Password</label>
                        <input type="password" id="regConfirmPassword" placeholder="Re-type password" minlength="6" required class="w-full rounded-xl border border-slate-300 px-4 py-3 text-slate-800 font-medium focus:outline-none focus:border-sky-500 focus:ring-2 focus:ring-sky-100 transition"/>
                    </div>
                </div>

                <div class="flex items-center gap-2 pt-1">
                    <input type="checkbox" id="agreeTerms" checked required class="rounded border-slate-300 text-sky-600 focus:ring-sky-500 h-4 w-4"/>
                    <label for="agreeTerms" class="text-slate-600 font-medium">I agree to the <a href="./#pricing" class="text-sky-600 underline">Terms of Service</a> & 3-Day Free Trial policy.</label>
                </div>

                <div class="pt-3">
                    <button type="submit" class="w-full btn-elite-gradient rounded-xl py-3.5 text-sm font-bold text-white shadow-md cursor-pointer">
                        Create Account & Go to Login &rarr;
                    </button>
                </div>
            </form>
        </div>

        <div class="text-center text-xs text-slate-500 mt-6 space-y-2">
            <p>Already have an account? <a href="login.html" class="text-sky-600 font-bold hover:underline">Sign in here</a></p>
            <p><a href="./" class="text-slate-400 hover:text-slate-600 transition">&larr; Back to ElitePay Home</a></p>
        </div>
    </div>

    <script>
        function showError(msg) {
            const el = document.getElementById('regErrorAlert');
            document.getElementById('regErrorMsg').innerHTML = msg;
            el.classList.remove('hidden');
        }

        document.getElementById('regForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const storeName = document.getElementById('regStoreName').value.trim();
            const ownerName = document.getElementById('regFullName').value.trim();
            const email = document.getElementById('regEmail').value.trim().toLowerCase();
            const password = document.getElementById('regPassword').value;
            const confirmPassword = document.getElementById('regConfirmPassword').value;

            // Validation
            if (password.length < 6) {
                showError("Password must be at least 6 characters long.");
                return;
            }

            if (password !== confirmPassword) {
                showError("Passwords do not match. Please re-enter your password.");
                return;
            }

            let accounts = {};
            try {
                accounts = JSON.parse(localStorage.getItem('elitepay_accounts')) || {};
            } catch(err) {
                accounts = {};
            }

            // Check if already registered
            if (accounts[email]) {
                showError(`An account with email <strong>${email}</strong> already exists. <a href="login.html?email=${encodeURIComponent(email)}" class="underline font-bold text-sky-700">Click here to sign in &rarr;</a>`);
                return;
            }

            const now = Date.now();
            const trialEndsAt = now + (3 * 24 * 60 * 60 * 1000);
            const otp = Math.floor(100000 + Math.random() * 900000).toString(); // Generate 6-digit OTP

            accounts[email] = {
                email: email,
                password: password, // Stored credential
                storeName: storeName || (ownerName + " Store"),
                ownerName: ownerName || "Merchant",
                emailVerified: false, // Must verify inside panel!
                verificationOtp: otp,
                plan: "3-Day Free Trial",
                planType: "trial",
                isTrial: true,
                trialEndsAt: trialEndsAt,
                createdAt: now,
                todaySales: "৳ 0.00",
                totalSales: "৳ 0.00",
                orderCount: 0,
                bkash: "01700-000000",
                nagad: "01800-000000",
                deviceName: "Android Companion (Offline)",
                deviceToken: "elite_dev_" + Math.random().toString(36).substring(2, 9),
                merchantId: "ELITE-" + Math.floor(100000 + Math.random() * 900000),
                apiKey: "sk_live_" + Math.random().toString(36).substring(2, 14),
                webhookUrl: "https://" + email.split('@')[0] + ".com/api/payment-webhook",
                transactions: [
                    {
                        id: "BK" + Math.floor(10000000 + Math.random() * 90000000) + "X",
                        invoice: "INV-101",
                        gateway: "bKash",
                        phone: "01755-123***",
                        amount: "৳ 500.00",
                        status: "Verified",
                        time: "Trial Initialized"
                    }
                ],
                links: [
                    {
                        title: "My First Payment Link",
                        amount: 350,
                        url: "https://piprapayxjojo.vercel.app/pay/starter"
                    }
                ]
            };

            localStorage.setItem('elitepay_accounts', JSON.stringify(accounts));
            
            // Redirect to login with success notice
            window.location.href = 'login.html?registered=true&email=' + encodeURIComponent(email);
        });
    </script>
</body>
</html>
